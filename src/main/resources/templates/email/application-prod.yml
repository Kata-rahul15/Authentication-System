spring:
  application:
    name: student
  datasource:
    url: ${db_url}
    username: ${db_username}
    password: ${db_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

#  jpa:
#    hibernate:
#      ddl-auto: update
#    show-sql: false
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${github_client_id}
            client-secret: ${github_client_secret}
            scope:
              - read:user
              - user:email
          google:
            client-id: ${google_client_id}
            client-secret: ${google_client_secret}
            scope:
              - email
              - profile
#  mail:
#    host: smtp-relay.brevo.com
#    port: 587
#    username: ${mail_username}
#    password: ${mail_password}
#    properties:
#      mail:
#        smtp:
#          from: katarahul8@gmail.com
#          auth: true
#        starttls:
#          enable: true
#
#      debug: true
#    protocol: smtp
  mail:
    host: smtp-relay.brevo.com
    port: 465
    username: ${mail_username}
    password: ${mail_password}
    protocol: smtp

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

        debug: true
  data:
    redis:
      host: ${redis_host}
      port: ${redis_port}
      username: ${redis_username}
      password: ${redis_password}
logging:
  level:
    org.springframework.mail: DEBUG
    org.eclipse.angus.mail: DEBUG
    com.zaxxer.hikari: DEBUG
    org.postgresql: DEBUG
jwt:
  secret:
    key: ${jwt_secret_key}